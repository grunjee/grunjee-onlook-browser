<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f4"><title>Site Desk · Grunjee Labs</title><link rel="icon" href="/mark.svg"><link rel="stylesheet" href="/desk.css"></head><body>
<header class="top"><div class="brand"><span class="labmark" data-icon="flask"></span><strong>Grunjee Labs</strong><i></i><span class="product">Site Desk</span></div><div class="privacy"><span data-icon="lock"></span> Private workspace <b aria-hidden="true">G</b></div></header>
<main class="shell"><div class="heading"><div><button class="crumb" id="sites"><span data-icon="grid"></span> Websites <span data-icon="chevron"></span></button><h1 id="siteName">Website editor</h1></div><div class="head-actions"><button id="history" class="neutral"><span data-icon="history"></span>History</button><a id="viewLive" class="neutral" target="_blank" rel="noopener"><span data-icon="globe"></span>View website</a></div></div>
<div class="work"><section class="chat" aria-label="Conversation"><header class="panelhead"><h2><span data-icon="chat"></span>Conversation</h2></header><div class="thread" id="thread" aria-live="polite"></div><div id="decision"></div><div class="composer"><div id="picked"></div><form id="editForm"><textarea id="note" aria-label="Describe your website change" placeholder="Describe your change…" rows="2" maxlength="2500"></textarea><div class="compose-foot"><span id="inputStatus">Enter to send</span><button aria-label="Send change request" id="send" class="send"><span data-icon="send"></span></button></div></form></div></section>
<section class="canvas" aria-label="Website preview"><header class="canvashead"><h2><span data-icon="panel"></span>Website preview</h2><div class="head-tools"><span id="version" class="version"></span><span class="sep"></span><div class="devices"><button id="desktop" title="Desktop preview" aria-label="Desktop preview" aria-pressed="true"><span data-icon="monitor"></span></button><button id="mobile" title="Phone preview" aria-label="Phone preview" aria-pressed="false"><span data-icon="phone"></span></button></div></div></header>
<div class="canvasArea"><div class="paper"><div class="browserbar"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div><span><i data-icon="file"></i>Home page</span><i aria-hidden="true"></i></div><iframe title="Interactive website preview" id="frame" sandbox="allow-scripts"></iframe></div></div>
<footer class="canvasfoot"><div class="modes"><button id="select" aria-pressed="true"><span data-icon="cursor"></span>Select</button><button id="browse" aria-pressed="false"><span data-icon="eye"></span>Browse</button></div><span id="hint">Click text to select it</span></footer></section></div></main>
<dialog id="dialog"><div class="dlghead"><h2 id="dlgTitle"></h2><button id="closeDlg" class="icon" aria-label="Close dialog"><span data-icon="x"></span></button></div><div id="dlgBody"></div></dialog><div id="toast" role="status" hidden></div><script src="/desk.js" type="module"></script></body></html>
